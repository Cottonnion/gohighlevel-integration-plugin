name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or commit to deploy (defaults to main)'
        required: false
        default: main
        type: string

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            DEPLOY_PATH="${{ secrets.SSH_PATH }}"
            REPO_URL="https://Cottonnion:${{ secrets.GH_TOKEN }}@github.com/Cottonnion/gohighlevel-integration-plugin.git"
            DEPLOY_REF="${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}"

            if [ -d "${DEPLOY_PATH}/.git" ]; then
              cd "${DEPLOY_PATH}"
              git fetch --tags origin
              git checkout --detach "${DEPLOY_REF}"
            else
              rm -rf "${DEPLOY_PATH}"
              git clone "${REPO_URL}" "${DEPLOY_PATH}"
              cd "${DEPLOY_PATH}"
              git checkout --detach "${DEPLOY_REF}"
            fi

            php /opt/cpanel/ea-wappspector/composer.phar install --no-dev --optimize-autoloader --no-interaction
